name: Build and download app

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build web app
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Upload web app
        uses: actions/upload-artifact@v5
        with:
          name: thread-wardrobe-web
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate native Flutter Android project
        run: flutter create --org com.thread --project-name thread_wardrobe --platforms android mobile_app_build

      - name: Copy native app source
        run: |
          cp mobile_app/pubspec.yaml mobile_app_build/pubspec.yaml
          rm -rf mobile_app_build/lib mobile_app_build/test
          cp -R mobile_app/lib mobile_app_build/lib
          cp -R mobile_app/test mobile_app_build/test

      - name: Configure Android app and notification settings
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle_file = Path("mobile_app_build/android/app/build.gradle.kts")
          source = gradle_file.read_text()
          source, compile_sdk_count = re.subn(
              r'(?m)^(\s*)compileSdk\s*=.*$',
              lambda match: f'{match.group(1)}compileSdk = 37',
              source,
              count=1,
          )
          if compile_sdk_count != 1:
              raise SystemExit("Flutter Android compileSdk setting was not found.")
          if "isCoreLibraryDesugaringEnabled" not in source:
              if "compileOptions {" not in source:
                  raise SystemExit("Flutter Android Gradle compileOptions block was not found.")
              source = source.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )
          if "desugar_jdk_libs" not in source:
              dependency_block = '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              if "\nflutter {" not in source:
                  raise SystemExit("Flutter Android Gradle insertion point was not found.")
              source = source.replace("\nflutter {", dependency_block + "\nflutter {", 1)
          gradle_file.write_text(source)

          manifest_file = Path("mobile_app_build/android/app/src/main/AndroidManifest.xml")
          manifest = manifest_file.read_text()
          manifest, label_count = re.subn(
              r'android:label="[^"]+"',
              'android:label="AuraShift"',
              manifest,
              count=1,
          )
          if label_count != 1:
              raise SystemExit("Flutter Android application label was not found.")
          if "android.permission.CAMERA" not in manifest:
              manifest, permission_count = re.subn(
                  r'(?m)^([ \t]*)<application\b',
                  lambda match: (
                      f'{match.group(1)}<uses-permission android:name="android.permission.CAMERA" />\n'
                      f'{match.group(1)}<application'
                  ),
                  manifest,
                  count=1,
              )
              if permission_count != 1:
                  raise SystemExit("Flutter Android application manifest was not found.")
          manifest_file.write_text(manifest)
          PY

      - name: Install Flutter dependencies
        run: flutter pub get
        working-directory: mobile_app_build

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons
        working-directory: mobile_app_build

      - name: Install Android SDK platform and NDK
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "::error::Android SDK manager was not found at $sdkmanager."
            exit 1
          fi
          for attempt in 1 2 3; do
            if "$sdkmanager" --install "platforms;android-37" "ndk;28.2.13676358"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Android SDK/NDK installation attempt $attempt failed; retrying in 20 seconds."
              sleep 20
            fi
          done
          exit 1

      - name: Test native app
        run: flutter test
        working-directory: mobile_app_build

      - name: Build native Android debug APK
        env:
          WARDROBE_API_URL: ${{ vars.WARDROBE_API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: >-
          flutter build apk --debug
          --dart-define=WARDROBE_API_URL="$WARDROBE_API_URL"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
        working-directory: mobile_app_build

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: AuraShift
          path: mobile_app_build/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
