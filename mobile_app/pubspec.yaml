name: thread_wardrobe
description: Native Flutter wardrobe organizer with outfit planning.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  image: ^4.5.4
  image_picker: ^1.2.0
  flutter_local_notifications: ^19.4.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../public/aura-mark.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: ../public/aura-mark.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
